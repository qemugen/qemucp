# QemuCP - Redis configuration optimized for web caching
bind 127.0.0.1
port 6379
protected-mode yes

# Memory - calculado en el instalador como RAM/5
# Se sobreescribe en post-install con valor dinamico
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence - desactivado para cache pura (mas rapido)
save ""
appendonly no

# Network
tcp-backlog 511
timeout 300
tcp-keepalive 60
maxclients 1000

# Performance
databases 16
hz 20
activerehashing yes
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
aof-use-rdb-preamble yes

# Logging
loglevel notice
logfile /var/log/redis/redis-server.log

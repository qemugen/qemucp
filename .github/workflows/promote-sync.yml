name: Pasar a release una version probada de HestiaCP

# Ultimo paso de la sincronizacion con HestiaCP (ver sync-upstream.yml):
# fusiona la rama sync/<version> en release SOLO si la prueba completa de esa
# rama (qemucp-ci.yml) salio en verde sobre su ultimo commit. Despues lanza
# la prueba completa sobre release, cierra el issue y avisa por email.
#
# Se lanza solo: qemucp-ci.yml lo llama cuando una rama sync/* sale en verde
# (automatico=true; entonces espera a que esa prueba termine del todo).
# Tambien a mano: Actions -> "Pasar a release una version probada".

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version de HestiaCP ya probada en su rama sync/ (p.ej. 1.10.6)'
        required: true
      automatico:
        description: 'Lanzado por la prueba al salir en verde (espera a que termine)'
        required: false
        default: 'false'

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  promote:
    name: sync/<version> -> release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ github.event.inputs.version }}
      AUTOMATICO: ${{ github.event.inputs.automatico }}
      HAY_CORREO: ${{ secrets.MAIL_USERNAME != '' && secrets.NOTIFY_EMAIL != '' }}

    steps:
      - name: Checkout de release
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Comprobar que la prueba de la rama salio en verde
        id: prueba
        run: |
          RAMA="sync/$VERSION"
          git fetch -q origin "$RAMA" || { echo "::error::No existe la rama $RAMA"; exit 1; }
          CABEZA=$(git rev-parse FETCH_HEAD)
          ultima() {
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/qemucp-ci.yml/runs?branch=${RAMA}&per_page=1" \
              --jq '.workflow_runs[0] | "\(.head_sha) \(.status) \(.conclusion) \(.html_url)"'
          }
          read -r SHA ESTADO CONCLUSION URL < <(ultima)
          # Lanzado por la propia prueba: aun le quedan unos segundos (limpiar)
          if [ "$AUTOMATICO" = "true" ]; then
            for i in $(seq 1 40); do
              [ "$ESTADO" = "completed" ] && break
              sleep 30
              read -r SHA ESTADO CONCLUSION URL < <(ultima)
            done
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Rama $RAMA en $CABEZA; ultima prueba: $SHA $ESTADO $CONCLUSION $URL"
          [ "$SHA" = "$CABEZA" ] || { echo "::error::La ultima prueba no es del ultimo commit de $RAMA: espera a que termine la que corresponde"; exit 1; }
          [ "$ESTADO" = "completed" ] || { echo "::error::La prueba de $RAMA aun no ha terminado ($URL)"; exit 1; }
          [ "$CONCLUSION" = "success" ] || { echo "::error::La prueba de $RAMA no salio en verde ($CONCLUSION): $URL"; exit 1; }

      - name: Fusionar en release y subir
        run: |
          git config user.name "QemuCP Sync Bot"
          git config user.email "soporte@qemucp.com"
          git merge --no-ff --no-edit -m "Pasar HestiaCP $VERSION a release (probado en sync/$VERSION)" FETCH_HEAD \
            || { git merge --abort; echo "::error::release ha cambiado y choca con sync/$VERSION: fusiona release en la rama, deja que se pruebe y repite"; exit 1; }
          git push -q origin release
          # Lo subido con GITHUB_TOKEN no dispara "push": prueba completa a mano
          gh workflow run qemucp-ci.yml --ref release

      - name: Cerrar el issue de esa version
        continue-on-error: true
        run: |
          for N in $(gh issue list --state open --search "HestiaCP $VERSION in:title" --json number --jq '.[].number'); do
            gh issue close "$N" --comment "Pasada a release. Se esta probando release; despues: actualizar primero UN servidor con \`bash qemucp_install.sh --actualizar\`."
          done

      - name: Aviso por email (pasada a release)
        if: success() && env.HAY_CORREO == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: QemuCP Bot <${{ secrets.MAIL_USERNAME }}>
          subject: "[QemuCP] HestiaCP ${{ env.VERSION }} probada en verde y pasada a release"
          body: |
            HestiaCP ${{ env.VERSION }} ha pasado la prueba completa en su rama sync/${{ env.VERSION }}
            y se ha pasado a release. Los servidores NO se actualizan solos.

            Siguiente paso: actualizar primero UN servidor
              bash qemucp_install.sh --actualizar
            y, si va bien, el resto.

            Prueba de la rama: ${{ steps.prueba.outputs.url }}

            -- QemuCP Bot

      - name: Aviso por email (no se pudo pasar a release)
        if: failure() && env.HAY_CORREO == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: QemuCP Bot <${{ secrets.MAIL_USERNAME }}>
          subject: "[QemuCP] HestiaCP ${{ env.VERSION }}: NO se ha podido pasar a release"
          body: |
            No se ha pasado HestiaCP ${{ env.VERSION }} a release (release no se ha tocado).
            Motivo y detalles: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            -- QemuCP Bot

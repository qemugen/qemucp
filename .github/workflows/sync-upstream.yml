name: Sync with HestiaCP upstream

on:
  workflow_dispatch:
    # Sincronizacion MANUAL solamente - ejecutar desde GitHub Actions
    inputs:
      dry_run:
        description: 'Dry run (no push, solo ver cambios)'
        required: false
        default: 'false'
        type: boolean

jobs:
  sync:
    name: Sync upstream HestiaCP -> QemuCP
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout QemuCP fork
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "QemuCP Sync Bot"
          git config user.email "soporte@qemugen.com"

      - name: Add HestiaCP upstream remote
        run: |
          git remote add upstream https://github.com/hestiacp/hestiacp.git || true

      - name: Fetch upstream
        run: git fetch upstream release --no-tags

      - name: Check for new commits
        id: check
        run: |
          UPSTREAM_HASH=$(git rev-parse upstream/release)
          OUR_HASH=$(git rev-parse HEAD)
          echo "upstream=$UPSTREAM_HASH" >> $GITHUB_OUTPUT
          echo "ours=$OUR_HASH" >> $GITHUB_OUTPUT

          if [ "$UPSTREAM_HASH" = "$OUR_HASH" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "changes_count=0" >> $GITHUB_OUTPUT
            echo "No new changes in upstream"
          else
            CHANGES=$(git log HEAD..upstream/release --oneline | wc -l)
            COMMITS=$(git log HEAD..upstream/release --oneline)
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "changes_count=$CHANGES" >> $GITHUB_OUTPUT
            # Guardar lista de commits en fichero para el email
            echo "$COMMITS" > /tmp/upstream_commits.txt
            echo "Found $CHANGES new commits in upstream"
            cat /tmp/upstream_commits.txt
          fi

      - name: Notify new upstream version available
        if: steps.check.outputs.has_changes == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: QemuCP Bot <${{ secrets.MAIL_USERNAME }}>
          subject: "[QemuCP] Nueva actualizacion de HestiaCP disponible - ${{ steps.check.outputs.changes_count }} commits"
          body: |
            Hola,

            HestiaCP ha publicado ${{ steps.check.outputs.changes_count }} nuevos commits
            que aun no estan en tu fork QemuCP.

            El workflow de sincronizacion automatica los esta aplicando ahora mismo.

            Detalles:
            - Repositorio: https://github.com/qemugen/qemucp
            - Rama: release
            - Commits upstream: ${{ steps.check.outputs.upstream }}

            Te enviare otro email cuando la sincronizacion termine.

            -- QemuCP Sync Bot

      - name: Merge upstream changes
        if: steps.check.outputs.has_changes == 'true'
        id: merge
        run: |
          # Guardar ficheros personalizados antes del merge
          git stash push -m "QemuCP customizations" \
            install/hst-install-ubuntu.sh \
            install/hst-install.sh \
            install/deb/nginx/nginx.conf \
            install/deb/apache2/apache2.conf \
            install/deb/mysql/my-large.cnf \
            install/deb/php-fpm/multiphp.tpl \
            install/deb/fail2ban/jail.local \
            2>/dev/null || true

          # Merge
          if git merge upstream/release --no-edit \
            -m "sync: Merge HestiaCP upstream $(date +%Y-%m-%d)"; then
            echo "merge_status=success" >> $GITHUB_ENV
          else
            echo "merge_status=conflict" >> $GITHUB_ENV
            git merge --abort
          fi

      - name: Restore QemuCP customizations
        if: |
          steps.check.outputs.has_changes == 'true' &&
          env.merge_status == 'success'
        run: |
          git stash pop 2>/dev/null || true
          git checkout HEAD -- \
            install/deb/redis/redis.conf \
            install/deb/sysctl/99-qemucp.conf \
            install/deb/templates/web/openlitespeed/ \
            install/ols-install.sh \
            web/images/logo.svg \
            web/images/logo-header.svg \
            web/images/logo.png \
            web/images/favicon.png \
            2>/dev/null || true
          git add -A
          git diff --cached --quiet || \
            git commit -m "restore: QemuCP customizations after upstream sync $(date +%Y-%m-%d)"

      - name: Push changes
        if: |
          steps.check.outputs.has_changes == 'true' &&
          env.merge_status == 'success' &&
          github.event.inputs.dry_run != 'true'
        run: git push origin release

      - name: Notify sync SUCCESS
        if: |
          steps.check.outputs.has_changes == 'true' &&
          env.merge_status == 'success'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: QemuCP Bot <${{ secrets.MAIL_USERNAME }}>
          subject: "[QemuCP] Sincronizacion con HestiaCP completada correctamente"
          body: |
            Hola,

            La sincronizacion con HestiaCP se ha completado correctamente.

            Resumen:
            - Commits aplicados: ${{ steps.check.outputs.changes_count }}
            - Personalizaciones QemuCP: preservadas
            - Logo, optimizaciones, OLS: sin cambios
            - Fork actualizado: https://github.com/qemugen/qemucp

            No necesitas hacer nada.

            -- QemuCP Sync Bot

      - name: Create issue on conflict
        if: |
          steps.check.outputs.has_changes == 'true' &&
          env.merge_status == 'conflict'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[SYNC] Conflicto con HestiaCP upstream - ${new Date().toISOString().split('T')[0]}`,
              body: `## Sincronizacion fallida - Intervencion manual necesaria\n\nEl merge automatico con HestiaCP ha fallado por conflictos.\n\n**Upstream commit:** \`${{ steps.check.outputs.upstream }}\`\n\n### Como resolver\n\`\`\`bash\ngit remote add upstream https://github.com/hestiacp/hestiacp.git\ngit fetch upstream release\ngit merge upstream/release\n# Resolver conflictos\ngit push origin release\n\`\`\``,
              labels: ['sync-conflict', 'needs-manual-review']
            });

      - name: Notify sync CONFLICT
        if: |
          steps.check.outputs.has_changes == 'true' &&
          env.merge_status == 'conflict'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: QemuCP Bot <${{ secrets.MAIL_USERNAME }}>
          subject: "[QemuCP] ACCION REQUERIDA - Conflicto en sincronizacion con HestiaCP"
          body: |
            Hola,

            La sincronizacion automatica con HestiaCP ha fallado por conflictos
            que requieren resolucion manual.

            Se ha creado un issue en GitHub con instrucciones:
            https://github.com/qemugen/qemucp/issues

            Upstream commit: ${{ steps.check.outputs.upstream }}

            Mientras tanto, tu fork QemuCP sigue funcionando con la
            version anterior sin interrupciones.

            -- QemuCP Sync Bot

      - name: Summary
        run: |
          if [ "${{ steps.check.outputs.has_changes }}" = "false" ]; then
            echo "### Fork actualizado - sin cambios upstream" >> $GITHUB_STEP_SUMMARY
          elif [ "$merge_status" = "conflict" ]; then
            echo "### CONFLICTO - Intervencion manual requerida" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Sincronizacion completada" >> $GITHUB_STEP_SUMMARY
            echo "${{ steps.check.outputs.changes_count }} commits aplicados" >> $GITHUB_STEP_SUMMARY
          fi

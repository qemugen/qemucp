name: Sincronizar con HestiaCP (rama de prueba)

# Trae una version NUEVA de HestiaCP a una rama de prueba sync/<version>,
# NUNCA directamente a release:
#   1. busca la ultima version publicada (etiqueta X.Y.Z) de hestiacp/hestiacp
#   2. si es mas nueva que la nuestra, la fusiona en sync/X.Y.Z (desde release)
#   3. comprueba que siguen las piezas de QemuCP (tema, APLICACIONES...)
#   4. sube la rama y lanza la prueba completa (qemucp-ci.yml) sobre ella
#   5. abre un issue con el resultado y los pasos siguientes
# Pasar a release lo hace una persona, con promote-sync.yml, y solo si la
# prueba de la rama salio en verde.
#
# Manual (Actions -> "Sincronizar con HestiaCP" -> Run workflow) o cada lunes.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version de HestiaCP (p.ej. 1.10.6). Vacio = la ultima publicada'
        required: false
        default: ''
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  sync:
    name: HestiaCP -> rama sync/<version>
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HAY_CORREO: ${{ secrets.MAIL_USERNAME != '' && secrets.NOTIFY_EMAIL != '' }}

    steps:
      - name: Checkout de release
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Configurar git
        run: |
          git config user.name "QemuCP Sync Bot"
          git config user.email "soporte@qemucp.com"

      - name: Buscar la version nueva de HestiaCP
        id: ver
        env:
          PEDIDA: ${{ github.event.inputs.version }}
        run: |
          git remote add upstream https://github.com/hestiacp/hestiacp.git
          # Etiquetas de upstream en su propio espacio (no se mezclan con las nuestras)
          git fetch -q upstream --no-tags '+refs/tags/*:refs/upstream-tags/*'
          NUESTRA=$(awk '/^Version:/ {print $2}' src/deb/hestia/control)
          if [ -n "$PEDIDA" ]; then
            OBJETIVO="$PEDIDA"
          else
            # Solo versiones publicadas X.Y.Z (sin beta ni rc)
            OBJETIVO=$(git for-each-ref --format='%(refname:lstrip=2)' refs/upstream-tags \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          fi
          git rev-parse -q --verify "refs/upstream-tags/$OBJETIVO^{commit}" >/dev/null \
            || { echo "::error::HestiaCP no tiene la version '$OBJETIVO'"; exit 1; }
          RAMA="sync/$OBJETIVO"
          echo "nuestra=$NUESTRA" >> "$GITHUB_OUTPUT"
          echo "objetivo=$OBJETIVO" >> "$GITHUB_OUTPUT"
          echo "rama=$RAMA" >> "$GITHUB_OUTPUT"

          MAYOR=$(printf '%s\n%s\n' "$NUESTRA" "$OBJETIVO" | sort -V | tail -1)
          if [ "$OBJETIVO" = "$NUESTRA" ] || [ "$MAYOR" = "$NUESTRA" ]; then
            echo "QemuCP ya esta en $NUESTRA (HestiaCP: $OBJETIVO). Nada que hacer."
            echo "accion=nada" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --heads origin "$RAMA" >/dev/null 2>&1; then
            echo "La rama $RAMA ya existe: esa version ya esta en prueba."
            echo "accion=nada" >> "$GITHUB_OUTPUT"
          else
            echo "HestiaCP $OBJETIVO es mas nueva que la nuestra ($NUESTRA)."
            echo "accion=fusionar" >> "$GITHUB_OUTPUT"
          fi

      - name: Fusionar en la rama de prueba
        id: fusion
        if: steps.ver.outputs.accion == 'fusionar'
        env:
          OBJETIVO: ${{ steps.ver.outputs.objetivo }}
          RAMA: ${{ steps.ver.outputs.rama }}
        run: |
          git checkout -q -b "$RAMA"
          if git merge --no-edit -m "sync: HestiaCP $OBJETIVO" "refs/upstream-tags/$OBJETIVO"; then
            echo "estado=ok" >> "$GITHUB_OUTPUT"
          else
            {
              echo "conflictos<<FIN"
              git diff --name-only --diff-filter=U
              echo "FIN"
            } >> "$GITHUB_OUTPUT"
            git merge --abort
            echo "estado=conflicto" >> "$GITHUB_OUTPUT"
          fi

      # Una fusion "sin conflictos" puede quedarse igualmente con la version de
      # upstream de un fichero nuestro: asi se perdio la pestana de WordPress en
      # la 1.10.3. Se comprueban las piezas propias antes de seguir.
      - name: Comprobar que siguen las piezas de QemuCP
        id: piezas
        if: steps.fusion.outputs.estado == 'ok'
        run: |
          FALTA=""
          comprobar() { grep -qF -- "$2" "$1" 2>/dev/null || FALTA="$FALTA
          - $1 (falta: $2)"; }
          existe() { [ -e "$1" ] || FALTA="$FALTA
          - $1 (no existe)"; }
          existe install/qemucp_install.sh
          existe web/css/src/themes/qemucp.css
          existe web/templates/pages/list_web_qemucp.php
          existe bin/v-qemucp-wp
          comprobar web/templates/includes/panel.php "QemuCP WP-TOOL"
          comprobar web/templates/includes/panel.php "/list/performance/"
          comprobar web/templates/includes/panel.php "qemucp-look-banner"
          comprobar web/list/web/index.php "list_web_qemucp"
          comprobar web/inc/main.php "function qemucp_theme_active"
          comprobar web/inc/main.php "function qemucp_backend_label"
          comprobar web/templates/pages/edit_server.php "qemucp-edit-link"
          comprobar web/templates/pages/list_webapps.php '"app" => $app_dir'
          comprobar install/deb/filemanager/filegator/configuration.php "qemucp-fm.css"
          comprobar func/main.sh "WEB_SUBDOMAINS"
          if [ -n "$FALTA" ]; then
            {
              echo "falta<<FIN"
              echo "$FALTA"
              echo "FIN"
            } >> "$GITHUB_OUTPUT"
            echo "estado=perdido" >> "$GITHUB_OUTPUT"
            echo "::error::La fusion ha perdido piezas de QemuCP:$FALTA"
          else
            echo "estado=ok" >> "$GITHUB_OUTPUT"
          fi

      - name: Subir la rama y lanzar la prueba completa
        if: steps.piezas.outputs.estado == 'ok'
        env:
          RAMA: ${{ steps.ver.outputs.rama }}
        run: |
          git push -q origin "$RAMA"
          # Lo subido con GITHUB_TOKEN no dispara "push": se lanza a mano
          gh workflow run qemucp-ci.yml --ref "$RAMA"

      - name: Abrir issue con el resultado
        if: steps.ver.outputs.accion == 'fusionar'
        env:
          OBJETIVO: ${{ steps.ver.outputs.objetivo }}
          NUESTRA: ${{ steps.ver.outputs.nuestra }}
          RAMA: ${{ steps.ver.outputs.rama }}
          FUSION: ${{ steps.fusion.outputs.estado }}
          PIEZAS: ${{ steps.piezas.outputs.estado }}
          CONFLICTOS: ${{ steps.fusion.outputs.conflictos }}
          FALTA: ${{ steps.piezas.outputs.falta }}
        run: |
          INFORME="ci-resultados-${RAMA//\//-}"
          if [ "$FUSION" = "ok" ] && [ "$PIEZAS" = "ok" ]; then
            TITULO="HestiaCP $OBJETIVO en prueba (rama $RAMA)"
            CUERPO="La version $OBJETIVO de HestiaCP se ha fusionado sin conflictos en la rama \`$RAMA\` (QemuCP estaba en $NUESTRA) y siguen todas las piezas de QemuCP.

          Se esta ejecutando la prueba completa sobre esa rama. **release no se ha tocado.**

          ### Siguientes pasos
          1. Esperar el resultado: rama \`$INFORME\`, fichero \`RESULTADO.md\` (o Actions -> QemuCP - instalacion completa).
          2. Si sale **todo OK**: Actions -> **Pasar a release una version probada** -> version \`$OBJETIVO\`.
          3. Actualizar primero UN servidor con \`bash qemucp_install.sh --actualizar\` y despues el resto.

          Si algo falla, se arregla en la rama \`$RAMA\` (cada subida vuelve a lanzar la prueba)."
          elif [ "$FUSION" = "conflicto" ]; then
            TITULO="HestiaCP $OBJETIVO: conflictos al fusionar"
            CUERPO="La version $OBJETIVO de HestiaCP choca con cambios de QemuCP en estos ficheros:

          \`\`\`
          $CONFLICTOS
          \`\`\`

          **No se ha subido nada; release no se ha tocado.** Hay que fusionarla a mano conservando lo de QemuCP:

          \`\`\`bash
          git fetch origin release && git checkout -b $RAMA origin/release
          git remote add upstream https://github.com/hestiacp/hestiacp.git
          git fetch upstream --no-tags '+refs/tags/$OBJETIVO:refs/upstream-tags/$OBJETIVO'
          git merge refs/upstream-tags/$OBJETIVO
          # resolver los conflictos conservando los bloques de QemuCP
          git push origin $RAMA
          \`\`\`

          La subida de la rama lanza la prueba completa. Despues: Actions -> Pasar a release una version probada."
          else
            TITULO="HestiaCP $OBJETIVO: la fusion pierde piezas de QemuCP"
            CUERPO="La version $OBJETIVO se fusiona sin conflictos, pero el resultado **ha perdido** partes de QemuCP:
          $FALTA

          **No se ha subido nada; release no se ha tocado.** Hay que hacer la fusion a mano y recuperar esas partes antes de subir la rama \`$RAMA\`."
          fi
          gh issue create --title "$TITULO" --body "$(printf '%s\n' "$CUERPO" | sed 's/^          //')"

      - name: Aviso por email (si estan configurados los secretos)
        if: steps.ver.outputs.accion == 'fusionar' && env.HAY_CORREO == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: QemuCP Bot <${{ secrets.MAIL_USERNAME }}>
          subject: "[QemuCP] HestiaCP ${{ steps.ver.outputs.objetivo }}: ${{ steps.fusion.outputs.estado == 'ok' && steps.piezas.outputs.estado == 'ok' && 'en prueba' || 'necesita revision' }}"
          body: |
            HestiaCP ${{ steps.ver.outputs.objetivo }} (QemuCP esta en ${{ steps.ver.outputs.nuestra }}).
            Detalles y pasos siguientes en los issues del repositorio:
            https://github.com/${{ github.repository }}/issues
            La rama release NO se ha tocado.
            -- QemuCP Sync Bot
